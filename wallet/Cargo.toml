[package]
name = "ring-wallet"
version = "0.1.0"
edition = "2021"
publish = false

# Reads positions out of the chain. Positions arrive as shielded payments
# carrying a memo, so the sender is not on the chain and cannot be. That is the
# point, and it is also why this exists: only a viewing key can read them.

[dependencies]
zcash_client_backend = { version = "0.24", features = [
    "sync",
    "lightwalletd-tonic-tls-webpki-roots",
    "lightwalletd-tonic-transport",
    "orchard",
] }
zcash_client_sqlite = { version = "0.22", features = ["unstable"] }
zcash_keys = { version = "0.16", features = ["orchard", "sapling"] }
zcash_protocol = "0.10"
zcash_primitives = "0.30"
zip32 = "0.2"
# The library decrypts Sapling and Orchard but not Ironwood, so that pool
# is decrypted here with the same machinery.
orchard = "0.15"
zcash_note_encryption = "0.4"
# Spending shielded funds needs a zk-SNARK proof. Sapling wants parameter
# files; Orchard builds its key in memory.
zcash_proofs = { version = "0.30", features = ["local-prover", "download-params"] }
bip0039 = { version = "0.12", features = ["all-languages"] }
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
# Money passes through this surface, so it is not hand-rolled.
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
anyhow = "1"
# The same version zcash_client_sqlite links, so there is one SQLite.
rusqlite = { version = "0.37", features = ["bundled"] }
async-trait = "0.1"
# tonic pulls rustls but picks no provider, so one is chosen here.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
